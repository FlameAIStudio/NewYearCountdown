<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 跨年烟花</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Arial Black', sans-serif;
            font-size: 200px;
            color: #ffd700;
            text-shadow: 
                0 0 20px #ffd700,
                0 0 40px #ff8c00,
                0 0 60px #ff4500;
            z-index: 10;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #countdown.show {
            opacity: 1;
        }
        #countdown.pulse {
            animation: pulse 0.5s ease-out;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #message.show {
            opacity: 1;
        }
        #year {
            font-family: 'Arial Black', sans-serif;
            font-size: 180px;
            color: #ffd700;
            text-shadow: 
                0 0 30px #ffd700,
                0 0 60px #ff8c00;
            letter-spacing: 20px;
        }
        #greeting {
            font-family: 'Arial Black', sans-serif;
            font-size: 52px;
            background: linear-gradient(180deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 20px;
            letter-spacing: 8px;
            position: relative;
            filter: drop-shadow(0 0 10px #FFD700) drop-shadow(0 0 20px #FFA500);
        }
        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 60px;
            font-size: 24px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 50px;
            color: #000;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
        }
        #startBtn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="countdown"></div>
    <div id="message">
        <div id="year">2026</div>
        <div id="greeting">HAPPY NEW YEAR</div>
    </div>
    <button id="startBtn">开始跨年倒计时</button>
    <script src="fireworks.js"></script>
</body>
</html>
